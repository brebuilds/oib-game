<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Isle Beach — Explore the Island</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui > * { pointer-events: auto; }

    /* Dialog system */
    #dialog-backdrop {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 100;
    }
    #dialog {
      display: none;
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15,15,30,0.85);
      border: 1px solid rgba(80,80,120,0.6);
      border-radius: 12px;
      padding: 20px 24px;
      min-width: 340px; max-width: 460px;
      z-index: 101;
      font-family: monospace;
      color: #fff;
    }
    #dialog-text {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    #dialog-options {
      list-style: none;
      padding: 0; margin: 0;
    }
    #dialog-options li {
      padding: 6px 10px;
      margin: 3px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    #dialog-options li:hover,
    #dialog-options li.selected {
      background: rgba(100,150,255,0.2);
      color: #ffd700;
    }
    #dialog-hint {
      margin-top: 10px;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }

    /* Message notifications */
    #messages {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 6px;
      z-index: 90;
      pointer-events: none;
    }
    .msg-toast {
      background: rgba(15,15,30,0.8);
      border: 1px solid rgba(80,80,120,0.5);
      border-radius: 8px;
      padding: 8px 16px;
      font: 12px monospace;
      color: #fff;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .msg-toast.fade { opacity: 0; }

    /* Discovery Journal */
    #journal {
      position: fixed;
      top: 12px; right: 12px;
      background: rgba(15,15,30,0.8);
      border: 1px solid rgba(80,80,120,0.5);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 200px;
      font: 12px monospace;
      color: #fff;
      z-index: 80;
      max-height: 50vh;
      overflow-y: auto;
    }
    #journal-header {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(80,80,120,0.4);
      padding-bottom: 6px;
    }
    .journal-entry {
      padding: 3px 0;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      position: relative;
      cursor: default;
    }
    .journal-entry.found {
      color: #ffd700;
    }
    .journal-entry .journal-tooltip {
      display: none;
      position: absolute;
      right: 100%;
      top: -4px;
      margin-right: 8px;
      background: rgba(15,15,30,0.95);
      border: 1px solid rgba(80,80,120,0.6);
      border-radius: 8px;
      padding: 8px 10px;
      width: 200px;
      font-size: 11px;
      color: #ccc;
      white-space: normal;
      line-height: 1.4;
      z-index: 85;
    }
    .journal-entry:hover .journal-tooltip {
      display: block;
    }

    /* Location name display */
    #location-label {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,15,30,0.7);
      border: 1px solid rgba(80,80,120,0.4);
      border-radius: 8px;
      padding: 6px 16px;
      font: bold 13px monospace;
      color: #ffd700;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 85;
      pointer-events: none;
    }
    #location-label.visible { opacity: 1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <div id="dialog-backdrop"></div>
    <div id="dialog">
      <div id="dialog-text"></div>
      <ul id="dialog-options"></ul>
      <div id="dialog-hint">↑↓ Navigate  ·  Enter/Space Select  ·  Esc Close</div>
    </div>
    <div id="messages"></div>
    <div id="journal">
      <div id="journal-header"></div>
      <div id="journal-list"></div>
    </div>
    <div id="location-label"></div>
  </div>
  <script type="module" src="/scene.js"></script>
</body>
</html>
